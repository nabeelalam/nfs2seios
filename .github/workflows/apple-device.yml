name: Native Apple device targets
on:
  workflow_call:
    inputs:
      classic_ui:
        type: boolean
        default: false
      linux_gate_passed:
        type: boolean
        required: true
      configuration:
        type: string
        required: true
      artwork_sha256:
        type: string
        default: ''
      include_probe:
        type: boolean
        default: false
      thin_lto:
        type: boolean
        default: false
      publish_ipa:
        type: boolean
        default: false
      publish_release:
        type: boolean
        default: false
jobs:
  build:
    if: inputs.linux_gate_passed && github.event.repository.visibility == 'public' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/hd-ui')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NFS_BUILD_CONFIGURATION: ${{ inputs.configuration }}
      NFS_CLASSIC_UI_REQUESTED: ${{ inputs.classic_ui && 'true' || 'false' }}
      NFS_PUBLISH_RELEASE_REQUESTED: ${{ inputs.publish_release && 'true' || 'false' }}
      NFS_THIN_LTO: ${{ inputs.thin_lto && 'ON' || 'OFF' }}
      NFS_BUILD_JOBS: '2'
      NFS_HD_ARTWORK_SHA256: ${{ inputs.artwork_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain information
        run: |
          python3 scripts/validate_artwork_sha256.py
          python3 scripts/check_runner_space.py
          case "$NFS_BUILD_CONFIGURATION" in Debug|Release) ;; *) echo "Invalid build configuration"; exit 1 ;; esac
          if [ "$NFS_THIN_LTO" = ON ] && [ "$NFS_BUILD_CONFIGURATION" != Release ]; then echo "ThinLTO validation requires Release"; exit 1; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Prepare checked engine and selected isolated renderer
        run: python3 scripts/prepare_ci_sources.py
      - name: Apple-only main queue regression
        run: |
          cmake -S . -B .build/apple-host -DCMAKE_BUILD_TYPE=Debug -DBOUNDARY_SANITIZERS=ON -DNFS_HD_ARTWORK_SHA256="$NFS_HD_ARTWORK_SHA256"
          cmake --build .build/apple-host --target apple_main_thread_tests -j "$NFS_BUILD_JOBS"
          ctest --test-dir .build/apple-host --output-on-failure -R '^actual_apple_main_queue$'
      - name: Configure native iPadOS targets
        run: |
          cmake -S . -B .build/ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DNFS_THIN_LTO="$NFS_THIN_LTO" -DNFS_THIN_LTO_JOBS=2 -DNFS_HD_ARTWORK_SHA256="$NFS_HD_ARTWORK_SHA256" -DNFS_CLASSIC_UI="$NFS_CLASSIC_UI" -DNFS_CLASSIC_DEFER_OWNER_TEMPLATE="$NFS_CLASSIC_DEFER_OWNER_TEMPLATE" -DNFS_FULL_MAPPED_ENGINE_DIR="$NFS_CI_ENGINE_SOURCE" -DNFS_RENDERER_SOURCE_DIR="$NFS_CI_RENDERER_SOURCE"
      - name: Compile translated engine to ARM64 objects
        run: |
          set -o pipefail
          /usr/bin/time -l cmake --build .build/ios --config "$NFS_BUILD_CONFIGURATION" --target full_mapped_translation -j "$NFS_BUILD_JOBS" 2>&1 | tee .build/engine-ipados.log
      - name: Compile existing renderer and native platform bridges
        run: |
          set -o pipefail
          cmake --build .build/ios --config "$NFS_BUILD_CONFIGURATION" --target glide_gles2 platform_bridges -j "$NFS_BUILD_JOBS" 2>&1 | tee .build/renderer-ipados.log
      - name: Link the complete translated engine with native platform services
        run: |
          set -o pipefail
          cmake --build .build/ios --config "$NFS_BUILD_CONFIGURATION" --target NFSIISEEngineCheck -j "$NFS_BUILD_JOBS" 2>&1 | tee .build/engine-link-ipados.log
      - name: Build unsigned native platform diagnostic
        if: inputs.include_probe
        run: |
          set -o pipefail
          cmake --build .build/ios --config "$NFS_BUILD_CONFIGURATION" --target NFSIISEProbe -j "$NFS_BUILD_JOBS" 2>&1 | tee .build/app-ipados.log
      - name: Build the original engine game app entry
        run: |
          set -o pipefail
          cmake --build .build/ios --config "$NFS_BUILD_CONFIGURATION" --target NFSIISEGame -j "$NFS_BUILD_JOBS" 2>&1 | tee .build/game-app-ipados.log
      - name: Validate ARM64 bundle and package unsigned IPA
        if: inputs.include_probe
        run: python3 scripts/package_ipa.py ".build/ios/${NFS_BUILD_CONFIGURATION}-iphoneos/NFSIISEProbe.app" .build/NFSIISEProbe-unsigned.ipa
      - name: Validate and package the development game bundle
        run: python3 scripts/package_ipa.py ".build/ios/${NFS_BUILD_CONFIGURATION}-iphoneos/NFSIISEGame.app" .build/NFSIISEGame-development-unsigned.ipa
      - name: Bound optional artifact payload
        if: inputs.publish_ipa
        run: python3 scripts/check_artifact_budget.py
      - name: Upload development game (personal signing and gameplay validation required)
        if: inputs.publish_ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 1
          name: ${{ inputs.classic_ui && 'NFSIISEGame-classic-base-NEEDS-PERSONAL-ARTWORK' || 'NFSIISEGame-development-unsigned' }}
          path: |
            .build/NFSIISEGame-development-unsigned.ipa
            .build/NFSIISEGame-development-unsigned.json
          if-no-files-found: error
      - name: Upload diagnostic (requires personal signing before installation)
        if: inputs.publish_ipa && inputs.include_probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 1
          name: NFSIISEProbe-unsigned
          path: .build/NFSIISEProbe-unsigned.ipa
          if-no-files-found: error
      - name: Prepare allowlisted public download
        if: inputs.publish_release && !inputs.classic_ui
        run: python3 scripts/prepare_release_download.py .build/NFSIISEGame-development-unsigned.ipa .build/NFSIISEGame-development-unsigned.json .build/NFSIISEGame-development-unsigned.zip --source "$GITHUB_SHA"
      - name: Publish checked development download
        if: inputs.publish_release && !inputs.classic_ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="development-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > .build/release-notes.md <<'NOTES'
          Native ARM64 iPad development candidate. Personal signing through SideStore is required. Original game assets must be supplied separately.

          Optional classic UI changes are isolated from the default build. The package manifest records whether they were enabled and the approved artwork-manifest fingerprint. Original game data is excluded.

          This is an experimental native ARM64 development package. Consult the source revision and current project documentation for the changes in this candidate. Compilation and package checks do not establish physical iPad performance, battery efficiency, stability or complete device acceptance.

          Four-finger tap shows or hides diagnostics; they start hidden. Detailed Game CPU averages owner-thread CPU time over 60 original submissions and excludes other workers, GPU time and waiting. Keep the optional 30 FPS lock off for 60 FPS comparisons. Managed-worker error cleanup and the bounded NFSIISE-stall.txt report remain available.

          Device stability, normal and Low Power Mode split-screen performance and battery cost require physical testing. No FPS or energy improvement is claimed. The keyboard button, touch gestures and full-screen/Game Mode request remain. Notification filtering is a separate iPad Gaming Focus setting.

          This download excludes configuration and language files as well as game data. Its corrected importer reads separately supplied install.win and text.eng from your selected game folder alongside GAMEDATA and FEDATA. Keep existing app data when updating. If import fails, acknowledge the displayed error; do not delete your source assets. Record the displayed menu and race FPS, input behavior and any exact error.
          NOTES
          printf '\nCompiler configuration: ThinLTO=%s, compile jobs=%s, ThinLTO backend cap=2.\n' "$NFS_THIN_LTO" "$NFS_BUILD_JOBS" >> .build/release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Native iPad development candidate $GITHUB_RUN_ID" --notes-file .build/release-notes.md .build/NFSIISEGame-development-unsigned.zip
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
