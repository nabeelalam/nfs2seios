name: Reviewed native helper comparisons
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Reviewed helper comparison only; never builds the game
        type: choice
        options:
          - copy-lock
          - thread-local
        default: copy-lock
permissions:
  contents: read
concurrency:
  group: reviewed-native-build
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main' && inputs.experiment == 'copy-lock'
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare standard mutex and Apple blocking unfair lock
        run: |
          set -euo pipefail
          uname -m
          xcrun --sdk macosx clang++ --version
          mkdir -p .build/lock-benchmark
          xcrun --sdk macosx clang++ -std=c++17 -O2 -pthread -Wall -Wextra -Werror tests/guest_copy_lock_benchmark.cpp -o .build/lock-benchmark/compare
          .build/lock-benchmark/compare
  review-tls:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'nabeelalam/nfs2seios' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/codex/hd-ui' && inputs.experiment == 'thread-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source publication and independent secrets
        run: |
          python3 scripts/setup_secret_scanner.py
          python3 scripts/publication_gate.py --mode history
          python3 scripts/publication_audit.py --mode worktree
      - name: Check bounded helper harness before Apple execution
        run: |
          python3 tests/apple_stop_slot_probe_test.py
          python3 tests/apple_cpu_workflow_test.py
          python3 scripts/apple_stop_slot_runtime_probe.py --local-safety-check
  native-tls:
    needs: review-tls
    if: success() && github.event_name == 'workflow_dispatch' && github.repository == 'nabeelalam/nfs2seios' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/codex/hd-ui' && inputs.experiment == 'thread-local'
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require native ARM host and pinned SDK compiler
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Compare source-only iOS ARM64 code generation
        run: python3 scripts/apple_stop_slot_probe.py
      - name: Compare native ARM helper timings
        run: python3 scripts/apple_stop_slot_runtime_probe.py
